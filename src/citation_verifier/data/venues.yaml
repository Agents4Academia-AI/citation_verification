# venues.yaml — the names a publication venue goes by.
#
# One entry per venue: every spelling a bibliography or a metadata source uses for it maps
# to the entry's key. Read by citation_verifier.venues; see that module for how a string
# is matched.
#
#   kind      conference | journal   an actual venue; two different ones are a mismatch
#             preprint               a preprint server or paper host: says where a copy
#                                    lives, not where (or whether) the work was published
#             series                 a proceedings series ("PMLR", "LNCS"): names the
#                                    volume, not the venue, so it contradicts no venue
#   acronyms  single tokens. Recognised as listed, in ALL CAPS, or when the acronym is the
#             whole string — "SODA" is the symposium, "soda" inside a name is a word. List
#             a second spelling only when people really write it ("NIPS", "Arxiv").
#             Do not list an acronym two venues share ("PRL", "FSE" is already taken).
#   names     phrases, matched case-insensitively on word boundaries. Longer names win,
#             so "… Machine Learning and Applications" is ICMLA and never ICML. A name
#             with fewer than three distinctive words ("Nature", "Machine Learning")
#             counts only when it is the whole venue string.
#   hosts     for a journal that prints a conference's proceedings: citing the paper under
#             either name is correct (ACM Transactions on Graphics / SIGGRAPH).
#
# NOT needed here, because the matcher handles them:
#   * decorations — years, ordinals ("36th", "Thirty-sixth"), volume/page numbers,
#     "Proceedings of the", a publisher prefix (IEEE, ACM, IEEE/CVF), a trailing "(ICML)";
#   * word-by-word abbreviations of a listed name — "IEEE Trans. Pattern Anal. Mach.
#     Intell.", "Adv. Neural Inf. Process. Syst.", "Proc. Int. Conf. Mach. Learn.".
#
# Some names below are not what anyone would write but what a metadata source returns
# (Semantic Scholar files the journal Machine Learning under "Machine-mediated learning").
# They are listed because the canonical side of the comparison comes from those sources.

