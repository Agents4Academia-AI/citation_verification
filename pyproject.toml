[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citation-verifier"
version = "0.1.0"
description = "Agent that verifies the citations in a paper draft (Agents4Academia)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agents4Academia — citation_verification team" }]
keywords = ["citations", "hallucination", "agents", "academia", "arxiv"]

# Core deps — schema + render + eval + grounding floor MUST run with only these,
# without claude-agent-sdk and without the optional 'requests' source clients.
dependencies = [
  "pydantic>=2,<3",   # the CitationRecord contract
  "jsonschema>=4",    # eval validates records against spec/record.schema.json
  "rapidfuzz>=3",     # fuzzy title matching in the resolver cascade
  "bibtexparser>=1.4",# parse .bib / .bbl in the LaTeX extractor
  "pyyaml>=6",        # config/sources.yaml, config/venues.yaml
]

[project.optional-dependencies]
# The LLM backends — all lazy/optional imports. `claude-agent-sdk` drives the
# Claude Code (subscription) path; `anthropic` drives the direct Messages API
# path used when an ANTHROPIC_API_KEY is set (cheaper per-token: no agent
# session overhead, plus prompt caching).
llm = ["claude-agent-sdk>=0.1.0", "anthropic>=0.40"]
# Keyed/extra grounding sources (DBLP/S2/OpenAlex/Crossref-polite over HTTP).
# The stdlib floor (Crossref + arXiv via urllib) needs nothing here.
sources = ["requests>=2.31"]
# The Discord front-end (cverify-bot). pypdf gives the PDF extractor a real
# text path; discord.py drives the gateway + /check slash command.
bot = ["discord.py>=2.3", "pypdf>=5"]
# PDF text extraction. pypdf is the always-available floor; PyMuPDF (fitz) is the
# column-aware upgrade — fixes two-column reading order + per-glyph spacing that
# wreck the reference parser. Optional: the extractor falls back to pypdf without it.
pdf = ["pypdf>=5", "pymupdf>=1.24"]
# The browser front-end (cverify-web): FastAPI + uvicorn serve the page and the
# SSE progress stream; python-multipart handles the PDF upload; markdown renders
# the report to HTML. All lazy — `import citation_verifier` never needs them.
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9", "markdown>=3.5"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
]
all = [
  "claude-agent-sdk>=0.1.0",
  "anthropic>=0.40",
  "requests>=2.31",
  "discord.py>=2.3",
  "pypdf>=5",
  "pymupdf>=1.24",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "markdown>=3.5",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
cverify = "citation_verifier.cli:main"
chbench = "chbench.cli:main"
cverify-bot = "citation_verifier.bot:main"
cverify-web = "citation_verifier.web:main"

[project.urls]
Homepage = "https://github.com/Agents4Academia/citation_verification"

[tool.hatch.build.targets.wheel]
packages = ["src/citation_verifier", "src/chbench"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines tolerated in docstrings/tables

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Form()/File()/Depends() in argument defaults are the framework idiom,
# not the B008 mutable-default footgun.
extend-immutable-calls = ["fastapi.Form", "fastapi.File", "fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/citation_verifier"]
