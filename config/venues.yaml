# config/venues.yaml — harvest scope for chbench.
#
# Declares which venues chbench harvests papers from, and the harvest window, so
# harvest.py knows what to collect. No secrets.
#
# The venue ALIAS table — the many spellings of one venue ("NeurIPS", "NIPS", "Advances in
# Neural Information Processing Systems", …) — is not here: it ships with the package as
# src/citation_verifier/data/venues.yaml and is read by citation_verifier.venues, which
# the metadata check (CitedAs.venue vs Resolved.venue) uses. Add venues and spellings there.

# Which venues chbench collects from, and how much.
harvest_scope:
  - venue: NeurIPS
    year: 2025
    max_papers: 120
  - venue: ICLR
    year: 2026
    max_papers: 80
